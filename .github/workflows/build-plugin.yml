name: Build plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/plugin/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/plugin/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Validate bundle
        run: node --check dist/index.js
      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: dimensions-toypad-plugin-dist
          path: source/plugin/dist/index.js
